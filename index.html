<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>Happy Birthday Koko 🎂</title>
<meta name="description" content="大好きな彼氏へ、小さなお誕生日サプライズ。">
<meta name="theme-color" content="#ecdcfc">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#f8f2ff; --bg2:#ecdcfc; --bg3:#e0c9fa;
  --glass:rgba(255,255,255,.6); --glass-b:rgba(160,110,220,.28);
  --text:#3e2463; --muted:#7c64a3; --accent:#b45fd6; --accent2:#a98bf5; --gold:#b9831f;
  --title:#5d2d93;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Zen Maru Gothic",system-ui,sans-serif;color:var(--text);
  background:radial-gradient(ellipse at 30% 20%,var(--bg3),transparent 60%),
             radial-gradient(ellipse at 80% 90%,#f3d9f5,transparent 60%),
             linear-gradient(160deg,var(--bg1),var(--bg2));
  background-color:var(--bg1);
  user-select:none;
}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0}
.scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;visibility:hidden;transform:scale(.96);transition:opacity .6s,transform .6s,visibility .6s;z-index:1}
.scene.active{opacity:1;visibility:visible;transform:none}
.card{width:min(360px,100%);background:var(--glass);border:1px solid var(--glass-b);border-radius:28px;
  padding:28px 22px;text-align:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(120,70,180,.18),inset 0 1px 0 rgba(255,255,255,.8)}
h1,h2{font-family:"Playfair Display","Zen Maru Gothic",serif;font-weight:800}
h2{font-size:1.4rem;margin-bottom:8px;color:var(--title)}
p.sub{color:var(--muted);font-size:.9rem;line-height:1.7}
.btn{display:block;width:100%;margin-top:14px;padding:13px 18px;border:0;border-radius:999px;cursor:pointer;
  font:700 1rem "Zen Maru Gothic",sans-serif;color:#fff;
  background:linear-gradient(135deg,#c99cf0,#9f7be8);box-shadow:0 6px 20px rgba(159,123,232,.35);
  transition:transform .15s,filter .15s}
.btn:active{transform:scale(.96)} .btn:hover{filter:brightness(1.05)}
.btn.ghost{background:rgba(255,255,255,.65);color:var(--text);box-shadow:none;border:1px solid var(--glass-b)}
.row{display:flex;gap:10px}.row .btn{flex:1}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}

/* lock */
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 22px}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--muted);transition:.2s}
.dot.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:16px;justify-content:center}
.key{width:64px;height:64px;border-radius:50%;border:1px solid var(--glass-b);background:rgba(255,255,255,.7);
  color:var(--text);font:600 1.4rem "Zen Maru Gothic";cursor:pointer;transition:.15s}
.key:active{background:rgba(180,95,214,.25);transform:scale(.92)}
.key.fn{font-size:1rem;color:var(--accent)}
.hint{margin-top:16px;font-size:.85rem;color:var(--muted);min-height:1.2em}

/* cake */
.cake-wrap{position:relative;width:220px;height:230px;margin:0 auto}
.cake-wrap svg{width:100%;height:100%;overflow:visible}
.flame{transform-origin:110px 52px;transform:scale(0);transition:transform .4s}
.lit .flame{transform:scale(1);animation:flick .15s infinite alternate}
@keyframes flick{to{transform:scale(1.08,.94) rotate(2deg)}}
.match{font-size:2.6rem;display:inline-block;cursor:pointer;margin-top:4px;filter:drop-shadow(0 0 10px #ff9a3c)}
.match.used{opacity:.3;pointer-events:none}

/* gift */
.gift-row{display:flex;justify-content:center;gap:22px;font-size:4.2rem;margin:20px 0}
.gift-row span{cursor:pointer;transition:transform .2s}
.gift-row span:hover{transform:scale(1.1) rotate(-4deg)}
.reminder{font-size:.85rem;color:var(--muted);background:rgba(255,255,255,.5);border-radius:12px;padding:8px 12px;border:1px dashed var(--glass-b)}

/* letter */
.letter{background:rgba(255,255,255,.55);border:1px solid var(--glass-b);border-radius:18px;padding:18px;
  text-align:left;max-height:50vh;overflow-y:auto;line-height:1.9;font-size:.95rem;white-space:pre-line}
.letter::-webkit-scrollbar{width:5px}.letter::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:9px}
.caret::after{content:"▍";animation:blink 1s infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}

/* avatar */
.avatar{width:96px;height:96px;margin:0 auto 14px;border-radius:24px;background:rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;font-size:3.4rem;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
#qMsg{min-height:1.4em;margin-top:10px;color:var(--accent);font-weight:700}

/* heart-catch game */
#game{position:fixed;inset:0;z-index:2;display:none;overflow:hidden;touch-action:manipulation}
#gameHud{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:3;display:none;white-space:nowrap;
  padding:8px 22px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid var(--glass-b);
  font:700 .95rem "Zen Maru Gothic";color:var(--text)}
#gameHud b{color:var(--accent)}
.target{position:absolute;font-size:3.4rem;line-height:1;cursor:pointer;transform:translate(-50%,-50%);
  transition:left .45s cubic-bezier(.3,1.5,.5,1),top .45s cubic-bezier(.3,1.5,.5,1),opacity .25s;
  filter:drop-shadow(0 6px 12px rgba(150,90,210,.35))}
.target span{display:block;animation:wiggle 1s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-10deg) scale(1.05)}75%{transform:rotate(10deg) scale(.95)}}
.target.hide{opacity:0;pointer-events:none}
.say{position:absolute;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;
  font:700 1.1rem "Zen Maru Gothic";color:var(--accent);text-shadow:0 2px 0 #fff,0 0 10px #fff;animation:sayUp 1.1s forwards}
@keyframes sayUp{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}
#gameDone{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  font:800 2rem "Zen Maru Gothic";color:#7b3fbf;text-shadow:0 0 20px #fff;pointer-events:none;text-align:center}

/* love */
.photo{width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#ffd0e8,#d8c4ff);
  display:flex;align-items:center;justify-content:center;font-size:4rem;margin:12px 0;box-shadow:0 8px 24px rgba(120,70,180,.2)}
.photo img{width:100%;height:100%;object-fit:cover}
.love-text{text-align:left;font-size:.92rem;line-height:1.8;color:var(--text);max-height:24vh;overflow-y:auto;white-space:pre-line}
.tag{color:var(--accent);font-weight:700;font-size:.9rem;margin-top:8px;text-align:left}

/* final */
#final .big{font-size:clamp(3rem,14vw,5rem);line-height:1;color:#8a45cf;
  text-shadow:0 0 30px rgba(255,255,255,.9),0 4px 0 rgba(160,110,220,.25)}
#final .name{font-family:"Playfair Display",serif;font-style:italic;font-size:1.6rem;color:var(--gold);margin:14px 0 6px}
.floaty{position:fixed;bottom:-140px;z-index:1;pointer-events:none;animation:rise linear forwards}
.floaty.pic{width:86px;height:86px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.9);box-shadow:0 6px 20px rgba(120,70,180,.3)}
.floaty.emo{font-size:2.2rem}
@keyframes rise{to{transform:translateY(calc(-100vh - 280px)) rotate(var(--r,20deg))}}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
#musicBtn{position:fixed;top:14px;right:14px;z-index:6;width:42px;height:42px;border-radius:50%;border:1px solid var(--glass-b);
  background:var(--glass);color:var(--text);font-size:1.1rem;cursor:pointer;display:none;backdrop-filter:blur(8px)}
@media (prefers-reduced-motion:reduce){.float,.floaty,.target span{animation:none}}
</style>
</head>
<body>
<canvas id="hearts"></canvas>
<canvas id="confetti"></canvas>
<button id="musicBtn" aria-label="音楽のオン・オフ">🎵</button>

<!-- 1. Passcode -->
<section class="scene active" id="lock">
  <div class="card">
    <h2 style="font-size:1.15rem;letter-spacing:.1em">パスコードを入力してね</h2>
    <p class="sub" id="lockHint"></p>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
    <div class="hint" id="lockMsg"></div>
  </div>
</section>

<!-- 2. Cake -->
<section class="scene" id="cake">
  <div class="card">
    <div class="cake-wrap" id="cakeWrap">
      <svg viewBox="0 0 220 230" aria-hidden="true">
        <defs>
          <linearGradient id="top" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b9a4ff"/><stop offset="1" stop-color="#8f74e8"/></linearGradient>
          <linearGradient id="bot" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e6b8ff"/><stop offset="1" stop-color="#c286ea"/></linearGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
        </defs>
        <ellipse cx="110" cy="214" rx="100" ry="12" fill="#d9c8f2"/>
        <rect x="22" y="140" width="176" height="70" rx="14" fill="url(#bot)"/>
        <path d="M22 150 q22 22 44 0 q22 22 44 0 q22 22 44 0 q22 22 44 0 v-6 h-176z" fill="#fff" opacity=".95"/>
        <rect x="45" y="88" width="130" height="58" rx="12" fill="url(#top)"/>
        <path d="M45 98 q16 18 32 0 q16 18 33 0 q16 18 33 0 q16 18 32 0 v-6 h-130z" fill="#fff" opacity=".95"/>
        <g fill="#fff6"><circle cx="70" cy="125" r="4"/><circle cx="150" cy="120" r="4"/><circle cx="60" cy="185" r="5"/><circle cx="165" cy="188" r="5"/><circle cx="110" cy="190" r="5"/></g>
        <rect x="104" y="56" width="12" height="34" rx="3" fill="#fff"/>
        <path d="M104 62 l12 6 M104 72 l12 6 M104 82 l12 6" stroke="#b45fd6" stroke-width="3"/>
        <g class="flame"><circle cx="110" cy="42" r="26" fill="url(#glow)"/><path d="M110 22 C120 36 118 50 110 52 C102 50 100 36 110 22z" fill="#ffb347"/><path d="M110 32 C115 40 114 48 110 49 C106 48 105 40 110 32z" fill="#fff4c2"/></g>
      </svg>
    </div>
    <p class="sub" id="cakeMsg">ろうそくに火をつけて、願いごとをしてね 🕯️</p>
    <div class="match float" id="match" role="button" aria-label="ろうそくに火をつける">🔥</div>
    <button class="btn" id="cakeNext" style="display:none">次へ →</button>
  </div>
</section>

<!-- 3. Gift -->
<section class="scene" id="gift">
  <div class="card">
    <h2>Kokoへの贈りもの ✨</h2>
    <p class="sub">あなたのために、特別なものを用意したよ…</p>
    <div class="gift-row"><span class="float gift-open">💜</span><span class="float gift-open" style="animation-delay:.4s">💌</span></div>
    <div class="reminder">💡 手紙をタップして開けてね</div>
  </div>
</section>

<!-- 4. Letter -->
<section class="scene" id="letterScene">
  <div class="card">
    <h2>お誕生日おめでとう！</h2>
    <div class="letter" id="letter"></div>
    <button class="btn" id="letterNext" style="display:none">次へ →</button>
  </div>
</section>

<!-- 5. Question -->
<section class="scene" id="question">
  <div class="card" id="qCard">
    <div class="avatar float" id="qAvatar">🥺</div>
    <h2 style="font-size:1.1rem;line-height:1.7" id="qText"></h2>
    <div id="qBtns"></div>
    <div id="qMsg"></div>
  </div>
</section>

<!-- 6. Game intro -->
<section class="scene" id="gameIntro">
  <div class="card">
    <div class="avatar float">💜</div>
    <h2>ちょっとゲームしよう！</h2>
    <p class="sub" id="gameRule"></p>
    <p class="sub" style="color:var(--gold);margin-top:8px">🐸 カエルはハートじゃないよ（笑）</p>
    <button class="btn" id="startGame">スタート</button>
  </div>
</section>

<!-- 7. Eternal love -->
<section class="scene" id="love">
  <div class="card">
    <h2>永遠の愛 💖</h2>
    <div class="photo" id="lovePhoto">🧸</div>
    <div class="love-text" id="loveText"></div>
    <div class="tag" id="loveTag"></div>
    <div class="row"><button class="btn ghost" id="loveHome">最初から</button><button class="btn" id="loveNext">次へ →</button></div>
  </div>
</section>

<!-- 8. I love you -->
<section class="scene" id="iloveyou">
  <div class="card">
    <div class="avatar pop" id="kissAvatar">😽</div>
    <h2 style="color:var(--accent)">ちゅっ 💋</h2>
    <h2>愛してる！</h2>
    <p class="sub" id="iluText"></p>
    <button class="btn" id="iluNext">うん 💕</button>
  </div>
</section>

<!-- 9. Final -->
<section class="scene" id="final">
  <div style="text-align:center;position:relative;z-index:2;padding:0 16px">
    <p class="sub" style="letter-spacing:.3em">✦ ✦ ✦</p>
    <h1 class="big">Happy<br>Birthday</h1>
    <div class="name" id="finalName"></div>
    <p class="sub" id="finalMsg" style="font-size:1.05rem;color:var(--text);font-weight:700"></p>
    <p class="sub" style="margin-top:26px" id="finalFrom"></p>
    <button class="btn ghost" id="replay" style="width:auto;display:inline-block;margin-top:24px;padding:10px 24px">↻ もう一度見る</button>
  </div>
</section>

<div id="game"></div>
<div id="gameHud">ハート：<b id="score">0</b> / <span id="goal">10</span></div>
<div id="gameDone">ミッション成功 ✨<span style="font-size:1.1rem;color:var(--text)">さすが私の彼氏！</span></div>

<audio id="music" loop preload="auto"></audio>

<script>
/* =====================================================================
   ✏️  EDIT EVERYTHING HERE — names, passcode, messages, photos, music
   Put photos in the  images/  folder and music in  music/  then list them below.
   ===================================================================== */
const CONFIG = {
  name: "Koko",                    // 彼氏の名前
  from: "あなたの彼女より 💜",       // 差出人
  passcode: "96811",
  passcodeHint: "ヒント：あなたと私だけが知っている数字 🤫💜",

  letter:
`大好きなKokoへ 💜

お誕生日おめでとう！
今日はあなたが主役の日。でも本当は、あなたがいてくれるだけで、私には毎日が特別な日なんだよ。

いつも優しくしてくれて、たくさん笑わせてくれて、本当にありがとう。
あなたの隣にいると、何気ない時間もあたたかくて、幸せな気持ちになれます。

私の彼氏になってくれて、ありがとう。
あなたを好きになったことは、私の人生でいちばん素敵な出来事です。

この一年が、笑顔と健康と、たくさんの幸せであふれますように。

これからもずっと、あなたの手を握って、毎日少しずつもっと好きになっていくね。

ずっとあなたの彼女より 💜`,

  question: "最後にもうひとつだけ…\nこれからもずっと、私の恋人でいてくれる？🥺",
  answers: { yes: "もちろん、ずっと 💖", no: "いやだ", maybe: "うーん…" },

  heartsToCatch: 10,

  loveMessage:
`これは、あなただけへのメッセージ。

つらい日には私の安らぎで、楽しい日には私の幸せ。
あなたに出会って、「帰る場所」は人なんだと知りました。
これからも一緒に、たくさんの素敵な思い出をつくっていこうね。`,
  loveTag: "あなたは私の永遠の恋人 🌸",

  iLoveYouText: "生まれてきてくれて、私を選んでくれて、ありがとう。言葉では足りないくらい、愛してるよ。",
  finalMessage: "世界でいちばん大好きだよ、Koko 💜",

  // Photos (optional). e.g. ["images/1.jpg", "images/2.jpg"]. Empty = cute emoji instead.
  photos: [],
  // Background music (optional). e.g. "music/song.mp3". Starts after the passcode is entered.
  music: "",
};
/* ===================================================================== */

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
function show(id){
  document.querySelectorAll('.scene').forEach(s => s.classList.toggle('active', s.id === id));
}
const photo = i => CONFIG.photos.length ? CONFIG.photos[i % CONFIG.photos.length] : null;
function setImg(el, src){ if (src){ el.textContent=''; const im=new Image(); im.src=src; im.alt=''; el.appendChild(im);} }

/* ---------- falling little hearts ---------- */
(() => {
  const c = $('hearts'), x = c.getContext('2d'); let W, H, hearts = [];
  const cols = ['rgba(190,140,240,.7)', 'rgba(220,150,230,.65)', 'rgba(170,120,230,.6)', 'rgba(240,170,215,.65)'];
  const size = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; };
  size(); addEventListener('resize', size);
  for (let i = 0; i < 45; i++) hearts.push({ x: Math.random(), y: Math.random(), r: rand(4, 9), s: rand(.0006, .0018),
    d: rand(0, 6), rot: rand(-.4, .4), c: cols[i % cols.length] });
  function heart(px, py, r, rot){
    x.save(); x.translate(px, py); x.rotate(rot); x.beginPath();
    x.moveTo(0, r * .35);
    x.bezierCurveTo(-r * 1.1, -r * .35, -r * .5, -r * 1.15, 0, -r * .5);
    x.bezierCurveTo(r * .5, -r * 1.15, r * 1.1, -r * .35, 0, r * .35);
    x.restore();
  }
  (function loop(t){
    x.clearRect(0, 0, W, H);
    for (const f of hearts){
      f.y += f.s; if (f.y > 1.03){ f.y = -.03; f.x = Math.random(); }
      const px = (f.x + Math.sin(t / 1800 + f.d) * .015) * W, py = f.y * H, r = f.r * devicePixelRatio;
      heart(px, py, r, f.rot + Math.sin(t / 1200 + f.d) * .25);
      x.fillStyle = f.c; x.fill();
    }
    requestAnimationFrame(loop);
  })(0);
})();

/* ---------- confetti ---------- */
const confetti = (() => {
  const c = $('confetti'), x = c.getContext('2d'); let parts = [], running = false;
  const cols = ['#c99cf0', '#a98bf5', '#f0a6d8', '#ffd27a', '#e9d5ff', '#b45fd6'];
  function burst(n = 160){
    c.width = innerWidth; c.height = innerHeight;
    for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2, y: innerHeight * .4, vx: rand(-9, 9), vy: rand(-14, -3),
      w: rand(5, 10), h: rand(3, 6), a: rand(0, 6), va: rand(-.3, .3), c: cols[i % cols.length], life: rand(90, 160) });
    if (!running){ running = true; requestAnimationFrame(loop); }
  }
  function loop(){
    x.clearRect(0, 0, c.width, c.height);
    parts = parts.filter(p => p.life-- > 0 && p.y < c.height + 20);
    for (const p of parts){
      p.vy += .3; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
    }
    if (parts.length) requestAnimationFrame(loop); else { running = false; x.clearRect(0, 0, c.width, c.height); }
  }
  return burst;
})();

/* ---------- music ---------- */
const music = $('music');
if (CONFIG.music){
  music.src = CONFIG.music; $('musicBtn').style.display = 'block';
  $('musicBtn').onclick = () => { music.paused ? music.play() : music.pause(); };
  music.onplay = () => $('musicBtn').textContent = '🎵'; music.onpause = () => $('musicBtn').textContent = '🔇';
}

/* ---------- 1. passcode ---------- */
let code = '';
$('lockHint').textContent = CONFIG.passcodeHint;
$('dots').innerHTML = '<span class="dot"></span>'.repeat(CONFIG.passcode.length);
['1','2','3','4','5','6','7','8','9','C','0','⌫'].forEach(k => {
  const b = document.createElement('button'); b.className = 'key' + (isNaN(k) ? ' fn' : ''); b.textContent = k;
  b.onclick = () => press(k); $('pad').appendChild(b);
});
addEventListener('keydown', e => { if ($('lock').classList.contains('active')){
  if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); } });
function press(k){
  if (k === 'C') code = ''; else if (k === '⌫') code = code.slice(0, -1);
  else if (code.length < CONFIG.passcode.length) code += k;
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < code.length));
  if (code.length === CONFIG.passcode.length){
    if (code === CONFIG.passcode){
      $('lockMsg').textContent = '開いたよ 💖';
      if (CONFIG.music) music.play().catch(() => {});
      setTimeout(() => show('cake'), 500);
    } else {
      $('lockMsg').textContent = 'ちがうよ… もう一回ね 🥺';
      $('lock').querySelector('.card').classList.add('shake');
      setTimeout(() => { $('lock').querySelector('.card').classList.remove('shake'); code = '';
        [...$('dots').children].forEach(d => d.classList.remove('on')); }, 450);
    }
  }
}

/* ---------- 2. cake ---------- */
let cakeStage = 0;
$('match').onclick = () => {
  if (cakeStage === 0){
    cakeStage = 1; $('cakeWrap').classList.add('lit'); $('match').textContent = '💨';
    $('cakeMsg').textContent = '目を閉じて願いごとをしたら、タップして火を消してね 🌬️';
  } else if (cakeStage === 1){
    cakeStage = 2; $('cakeWrap').classList.remove('lit'); $('match').classList.add('used');
    $('cakeMsg').innerHTML = `<b style="color:var(--accent)">お誕生日おめでとう、${CONFIG.name}！🎉</b><br>願いごとが全部叶いますように。`;
    confetti(220); $('cakeNext').style.display = 'block';
  }
};
$('cakeNext').onclick = () => show('gift');

/* ---------- 3/4. gift & letter ---------- */
document.querySelectorAll('.gift-open').forEach(el => el.onclick = () => { show('letterScene'); typeLetter(); });
function typeLetter(){
  const el = $('letter'), txt = CONFIG.letter; let i = 0; el.textContent = ''; el.classList.add('caret');
  const step = () => {
    i += 1; el.textContent = txt.slice(0, i); el.scrollTop = el.scrollHeight;
    if (i < txt.length) setTimeout(step, 45);
    else { el.classList.remove('caret'); $('letterNext').style.display = 'block'; }
  };
  setTimeout(step, 500);
  el.onclick = () => { i = txt.length; };   // tap to skip typing
}
$('letterNext').onclick = () => show('question');

/* ---------- 5. question ---------- */
$('qText').innerText = CONFIG.question;
const qFaces = ['🥺', '😢', '😭', '🥹'];
let noCount = 0;
[['no', CONFIG.answers.no], ['yes', CONFIG.answers.yes], ['maybe', CONFIG.answers.maybe]].forEach(([k, label]) => {
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = label; b.dataset.k = k; $('qBtns').appendChild(b);
  b.onclick = () => {
    if (k === 'yes'){
      $('qAvatar').textContent = '🥰'; $('qMsg').textContent = 'やったー！そう言ってくれると思ってた 💖'; confetti(140);
      setTimeout(() => show('gameIntro'), 1600);
    } else if (k === 'no'){
      noCount++; $('qAvatar').textContent = qFaces[Math.min(noCount, 3)];
      $('qMsg').textContent = ['ほんとに？🥺', 'うそでしょ？😢', 'お願い、「もちろん」って言って 😭', 'このボタン、もう疲れちゃったみたい 😤'][Math.min(noCount - 1, 3)];
      b.style.transform = `scale(${Math.max(.4, 1 - noCount * .18)})`;
      const yes = $('qBtns').querySelector('[data-k=yes]'); yes.style.transform = `scale(${1 + noCount * .08})`;
      if (noCount >= 4) b.style.display = 'none';
      $('qCard').classList.add('shake'); setTimeout(() => $('qCard').classList.remove('shake'), 400);
    } else {
      $('qAvatar').textContent = '🤔'; $('qMsg').textContent = 'もう一回考えて… 正解はひとつだけだよ 😏💜';
    }
  };
});

/* ---------- 6. heart-catch mini game ---------- */
$('gameRule').textContent = `ぴょんぴょん逃げるハートを${CONFIG.heartsToCatch}回タップしてね。次のサプライズが開くよ 💜`;
$('goal').textContent = CONFIG.heartsToCatch;
$('startGame').onclick = startGame;

function startGame(){
  const area = $('game'); area.innerHTML = '';
  area.style.display = 'block'; $('gameHud').style.display = 'block';
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  let score = 0, done = false;
  const sweet = ['好き！', '大好き！', 'もっと！', 'ぎゅー！', 'ちゅっ 💋', 'かっこいい！', '最高！', 'さすが！', 'えらい！'];
  const spot = el => { el.style.left = rand(14, 86) + 'vw'; el.style.top = rand(20, 86) + 'vh'; };
  const make = emoji => {
    const el = document.createElement('div'); el.className = 'target';
    el.innerHTML = `<span>${emoji}</span>`; spot(el); area.appendChild(el); return el;
  };
  const say = (el, text) => {
    const s = document.createElement('div'); s.className = 'say'; s.textContent = text;
    s.style.left = el.style.left; s.style.top = el.style.top; area.appendChild(s); setTimeout(() => s.remove(), 1100);
  };

  const heart = make('💜');
  const frog = make('🐸'); frog.classList.add('hide');

  heart.addEventListener('pointerdown', e => {
    e.preventDefault(); if (done) return;
    score++; $('score').textContent = score;
    say(heart, pick(sweet));
    heart.querySelector('span').textContent = pick(['💜', '💖', '💗', '💕', '💞']);
    spot(heart);
    if (score >= CONFIG.heartsToCatch) finish();
  });
  frog.addEventListener('pointerdown', e => {
    e.preventDefault(); if (done) return;
    say(frog, 'ケロッ！ハズレ〜 🐸'); frog.classList.add('hide');
  });

  // the heart hops away on its own, and a frog sometimes sneaks in
  const hop = setInterval(() => { if (!done) spot(heart); }, 1500);
  const frogT = setInterval(() => {
    if (done || Math.random() < .4) return;
    spot(frog); frog.classList.remove('hide');
    setTimeout(() => frog.classList.add('hide'), 1300);
  }, 2300);

  function finish(){
    done = true; clearInterval(hop); clearInterval(frogT);
    heart.classList.add('hide'); frog.classList.add('hide');
    $('gameDone').style.display = 'flex'; confetti(200);
    setTimeout(() => {
      area.style.display = 'none'; area.innerHTML = '';
      $('gameHud').style.display = 'none'; $('gameDone').style.display = 'none';
      show('love');
    }, 2200);
  }
}

/* ---------- 7. love ---------- */
setImg($('lovePhoto'), photo(0));
$('loveText').textContent = CONFIG.loveMessage;
$('loveTag').textContent = CONFIG.loveTag;
$('loveHome').onclick = () => location.reload();
$('loveNext').onclick = () => show('iloveyou');

/* ---------- 8. I love you ---------- */
$('iluText').textContent = CONFIG.iLoveYouText;
setImg($('kissAvatar'), photo(1));
$('iluNext').onclick = () => { show('final'); finale(); };

/* ---------- 9. finale ---------- */
$('finalName').textContent = CONFIG.name;
$('finalMsg').textContent = CONFIG.finalMessage;
$('finalFrom').textContent = '✨ ' + CONFIG.from;
let floatTimer;
function finale(){
  confetti(260);
  const emos = ['💜', '💖', '🎈', '🌸', '✨', '🎂', '💌'];
  let i = 0;
  clearInterval(floatTimer);
  floatTimer = setInterval(() => {
    const src = photo(i);
    const el = src && i % 2 === 0 ? Object.assign(new Image(), { src, className: 'floaty pic', alt: '' })
                                  : Object.assign(document.createElement('div'), { className: 'floaty emo', textContent: emos[i % emos.length] });
    el.style.left = rand(2, 85) + 'vw'; el.style.animationDuration = rand(7, 12) + 's'; el.style.setProperty('--r', rand(-30, 30) + 'deg');
    document.body.appendChild(el); setTimeout(() => el.remove(), 13000); i++;
  }, 700);
}
$('replay').onclick = () => location.reload();
</script>
